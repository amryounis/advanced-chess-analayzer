<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uciboard</title>
<link rel="stylesheet" href="vendor/chessground.base.css">
<link rel="stylesheet" href="vendor/chessground.cburnett.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <span class="brand">uciboard <span class="ver" id="version"></span></span>
  <span class="engine" id="engine" data-state="none">
    <span class="dot"></span><span id="engine-text">starting…</span>
  </span>
  <span class="spacer"></span>
  <button id="btn-undo" title="Take back the last move (Left arrow)">Undo</button>
  <button id="btn-reset" title="Back to the starting position">New</button>
  <button id="btn-flip" title="Turn the board round (F)">Flip</button>
  <button id="btn-pause" title="Stop or restart the analysis (Space)" aria-pressed="false">Pause</button>
</header>

<main class="desk">
  <section class="left" aria-label="Board">
    <div class="viewbar" id="viewbar" hidden>
      <span>Looking at a position from the graph</span>
      <button id="btn-back" title="Back to the game (Esc)">Back to the game</button>
    </div>
    <div id="board" class="cg-wrap"></div>
    <div class="moves" id="moves" aria-label="Moves"></div>
    <div class="status" id="status" aria-live="off">
      <div class="numbers">
        <span class="eval" id="eval">–</span>
        <span id="depth" class="muted"></span>
        <span id="nps" class="muted"></span>
        <label class="arrows-pick" title="How many moves of the engine's best line to draw as arrows. White and Black moves alternate, so 4 is two moves each (counted from the start of the line, whichever sides are drawn).">Arrows
          <select id="arrows">
            <option value="0">off</option><option value="1">1 move</option><option value="2">2 moves</option>
            <option value="3">3 moves</option><option value="4">4 moves</option><option value="6">6 moves</option>
            <option value="8">8 moves</option><option value="10">10 moves</option>
          </select>
          <select id="arrow-side" title="Draw the moves of both sides, or of one side only. The numbers keep their place in the line (1, 3 for White's moves).">
            <option value="both">both sides</option><option value="white">White only</option><option value="black">Black only</option>
          </select>
        </label>
      </div>
      <div class="pv" id="pv"></div>
      <div class="line-note" id="line-note" title="Material counted as pawn 1, knight and bishop 3, rook 5, queen 9"></div>
      <div class="tactic-tools">
        <span class="muted">Show on the board</span>
        <label class="check" title="Pieces the other side can win by an exchange (counted properly, not just attackers against defenders). Red: it is their move now."><input type="checkbox" id="show-loose" checked> Loose pieces</label>
        <label class="check" title="Pieces that cannot move without losing something behind them, and valuable pieces with something behind them"><input type="checkbox" id="show-pins" checked> Pins and skewers</label>
      </div>
      <ul class="tactics" id="tactics" aria-label="Tactical features of this position"></ul>
    </div>
    <input id="fen" class="fen" spellcheck="false" autocomplete="off"
           title="The position (FEN). Paste another and press Enter to set it up.">
    <div class="msg" id="msg" role="status"></div>
  </section>

  <section class="right" aria-label="Engine">
    <div class="pane-head">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-uci" aria-selected="true" data-tab="uci">UCI output</button>
        <button role="tab" id="tab-evo" aria-selected="false" data-tab="evo">Evolution</button>
      </div>
      <span class="spacer"></span>
      <span class="uci-tools">
        <label class="check"><input type="checkbox" id="follow" checked> Follow</label>
        <button class="quiet" id="btn-clear">Clear</button>
      </span>
    </div>
    <div class="pane" id="pane" tabindex="0"></div>

    <div class="evo" id="evo" hidden>
      <div class="evo-bar">
        <button id="evo-run" class="primary" title="Analyse the game on the board and draw its evolution graph">Analyse game</button>
        <label>Depth <input id="evo-depth" type="number" min="1" max="60" step="1" title="Search depth per position. The paper uses 20; deeper is slower."></label>
        <label>Seconds <input id="evo-seconds" type="number" min="1" max="600" step="1" title="Most time spent on one position, whatever the depth"></label>
        <button id="evo-pgn" title="Paste a game to analyse">Load PGN…</button>
        <button id="evo-cancel" hidden>Cancel</button>
        <span class="spacer"></span>
        <button id="evo-zoom-out" class="quiet" title="Zoom out" aria-label="Zoom out">&#x2212;</button>
        <button id="evo-zoom-in" class="quiet" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="evo-fit" class="quiet" title="Show the whole graph">Fit</button>
        <button id="evo-start" class="quiet" title="Back to the start of the game">Start</button>
      </div>
      <div class="evo-progress" id="evo-progress" hidden>
        <progress id="evo-bar" max="1" value="0"></progress><span id="evo-progress-text"></span>
      </div>
      <div class="evo-title" id="evo-title"></div>
      <div class="evo-graph" id="evo-graph">
        <svg id="evo-svg" role="img" aria-label="Evolution graph"></svg>
        <div class="evo-empty" id="evo-empty">
          Play a game on the board, or load a PGN, then press <b>Analyse game</b>.<br>
          Each position of the game is searched for its best continuations; the graph shows
          where the moves played could have led.
        </div>
      </div>
      <svg id="evo-chart" class="evo-chart" role="img" aria-label="Score chart"></svg>
      <div class="evo-info" id="evo-info" aria-live="polite"></div>
      <details class="legend" id="evo-legend">
        <summary>How to read it</summary>
        <div class="legend-grid" id="legend-grid"></div>
      </details>
    </div>
  </section>
</main>

<dialog id="pgn-dialog">
  <form method="dialog" class="pgn-form">
    <label for="pgn-text">Paste a game (PGN)</label>
    <textarea id="pgn-text" rows="12" spellcheck="false" placeholder="[Event &quot;...&quot;]&#10;&#10;1. e4 e5 2. Nf3 ..."></textarea>
    <div class="pgn-msg" id="pgn-msg" role="status"></div>
    <div class="pgn-buttons">
      <button type="button" id="pgn-cancel">Cancel</button>
      <button type="button" id="pgn-load" class="primary">Put it on the board</button>
    </div>
  </form>
</dialog>

<div class="promo" id="promo" hidden>
  <div class="promo-box" role="dialog" aria-label="Promote to">
    <button data-p="q" title="Queen">&#x265B;</button>
    <button data-p="r" title="Rook">&#x265C;</button>
    <button data-p="b" title="Bishop">&#x265D;</button>
    <button data-p="n" title="Knight">&#x265E;</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
